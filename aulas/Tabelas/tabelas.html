<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- estrutur da tabela -->
    <table border="7">
        <!-- cabesalho da tabela -->
        <thead>
            <tr>
                <!-- linha -->
                <!-- define o valor do cabeçalho-->
                <th>    Nome    </th> <!-- define o valor do cabeçalho-->
                <th>    Idade   </th> <!-- define o valor do cabeçalho-->
                <th>    cidade  </th> <!-- define o valor do cabeçalho-->

            </tr>

        </thead>
        <!-- corpo da tabela  -->
        <tbody>
            <tr>
                <td>    juselino    </td>
                <td>    37  </td>
                <td>    osasco  </td>
            </tr>
            <tr>
                <td>anne frank</td>
                <td>13</td>
                <td>berlin</td>

            </tr>
            <tr>
                <td>jasper</td>
                <td>17</td>
                <td>nagasaki</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
