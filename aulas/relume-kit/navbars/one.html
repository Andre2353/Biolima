<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>one</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        /*reset css */
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            text-decoration: none;
            border: none;
            background: none;
            font-family: "Roboto", sans-serif;
            font-size: 16px;
            color: #000000;

            header {

                width: 100%;
                height: 72px;
                padding: 16px 64px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header-content {

                display: flex;
                align-items: center;
                gap: 32px;
            }

            nav {

                display: flex;
                justify-content: center;
                align-items: center;
                gap: 32px;
            }

            .dropdowl-nav {

                gap: 4px;
                align-items: center;
                display: flex;
                justify-content: center;
            }

            .btn-wrapper {

                align-items: center;
                display: flex;
                justify-content: center;
                gap: 16px;
            }

            .btn-wrapper button {
                padding: 8px 20px;
                border: 1px solid black;
            }
        }
    </style>

</head>

<body>
    <header>
        <img src="./assets/Company Logo.svg" alt="chevron-down">
        <div class="header-content">
            <nav>
                <a href="">link one</a>
                <a href="">like two</a>
                <a href="">link three</a>
                <div class="dropdowl-nav">
                    <a>link Four</a>
                    <button>
                        <img src="./assets/Chevron Down.svg" alt="">
                    </button>
                </div>

            </nav>
            <div class="btn-wrapper">
                <button>Button</button>
                <button class="btn-primary"> Button</button>
            </div>
        </div>
    </header>

</body>

</html>
